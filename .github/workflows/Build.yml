name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn -B package
      - uses: actions/upload-artifact@v4
        with: {name: voicecast, path: target/voicecast-1.0.0.jar}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.0.0 --yes --cleanup-tag || true
          gh release create v1.0.0 target/voicecast-1.0.0.jar --title "VoiceCast 1.0.0" --notes "Сборка плагина VoiceCast" --target "$GITHUB_SHA"
      - name: Publish jar to dist branch
        run: |
          cp target/voicecast-1.0.0.jar /tmp/
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan dist
          git rm -rf -q .
          cp /tmp/voicecast-1.0.0.jar .
          curl -sSL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-ru-0.22.zip
          git add voicecast-1.0.0.jar model.zip
          git commit -q -m "Built jar"
          git push -f origin dist
